<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PigeonBox · Microphone</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 16px; opacity: .8; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid; background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Talk to Ask Pigeon</h1>
  <p id="status">Allow microphone access so you can dictate questions. Chrome turns your speech into text; PigeonBox never records audio.</p>
  <button id="allow" type="button">Allow microphone</button>
</main>
<script src="microphone.js"></script>
</body>
</html>
