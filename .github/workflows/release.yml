name: Release

# Push a tag like v0.2.0 whose version matches every package.json and manifest.json.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public build-time config (repository variables). Blank means Cloud shows as unavailable.
      VITE_PIGEONBOX_CLOUD_API_URL: ${{ vars.PIGEONBOX_CLOUD_API_URL }}
      VITE_PIGEONBOX_CLOUD_TRACKER_URL: ${{ vars.PIGEONBOX_CLOUD_TRACKER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package and manifest versions
        run: node scripts/check-versions.mjs "${GITHUB_REF_NAME}"

      - name: Clean install
        run: npm ci

      - name: Verify
        run: node scripts/verify.mjs --skip-package

      - name: Production build and deterministic ZIP
        run: node scripts/package-extension.mjs --out release

      - name: Rebuild and confirm the ZIP is reproducible
        run: |
          first=$(cut -d' ' -f1 release/PigeonBox-${GITHUB_REF_NAME}.sha256)
          node scripts/package-extension.mjs --out "$RUNNER_TEMP/second"
          second=$(cut -d' ' -f1 "$RUNNER_TEMP/second/PigeonBox-${GITHUB_REF_NAME}.sha256")
          test "$first" = "$second" || { echo "Release ZIP is not reproducible: $first vs $second"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/PigeonBox-${GITHUB_REF_NAME}.zip" \
            "release/PigeonBox-${GITHUB_REF_NAME}.sha256" \
            --title "PigeonBox ${GITHUB_REF_NAME}" \
            --notes "Prebuilt extension ZIP for loading unpacked or for the Chrome Web Store. Verify with: sha256sum -c PigeonBox-${GITHUB_REF_NAME}.sha256. See CHANGELOG.md for changes." \
            --verify-tag

      # Skipped until the store item exists and its credentials are set (docs/chrome-web-store.md).
      - name: Publish to the Chrome Web Store
        if: ${{ vars.CWS_EXTENSION_ID != '' }}
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH: ${{ vars.CWS_PUBLISH }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publish-chrome-web-store.mjs "release/PigeonBox-${GITHUB_REF_NAME}.zip"
