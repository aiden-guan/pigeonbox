name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository checks (namespace, private imports, secrets, env files)
        run: node scripts/check-repo.mjs

      - name: Versions
        run: node scripts/check-versions.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Manifest V3 browser tests
        run: npm run test:browser

      - name: Package and validate release ZIP
        run: node scripts/package-extension.mjs --out "$RUNNER_TEMP/package"

      - name: Unified release browser tests
        run: |
          unzip -q "$RUNNER_TEMP/package/PigeonBox-v$(node -p 'require("./package.json").version').zip" -d "$RUNNER_TEMP/release-extension"
          PIGEONBOX_BROWSER_EXTENSION_PATH="$RUNNER_TEMP/release-extension" npx playwright test tests/browser/release.spec.ts --output=test-results/release

      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pigeonbox-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pigeonbox-extension-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          retention-days: 7
