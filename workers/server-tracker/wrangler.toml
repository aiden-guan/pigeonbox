# Local development only: `npm run server:dev:tracker` runs the tracker on
# http://127.0.0.1:8789 against the same development sign-in as the API.
# Copy workers/api/.dev.vars to workers/server-tracker/.dev.vars (same secret).
#
# Production configuration is generated by `npm run server:deploy`. See docs/self-hosting.md.
name = "pigeonbox-tracker-dev"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
AUTH_PROVIDER = "dev"
